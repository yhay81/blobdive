name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust quality components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Package manifest
        run: cargo package --locked --allow-dirty
      - name: Machine contracts and completions
        shell: bash
        run: |
          cargo build --locked
          for document in brief detect inspect list read adapters error; do
            target/debug/blobdive --format json schema --document "${document}" \
              | jq -e . >/dev/null
          done
          for shell in bash zsh fish powershell elvish; do
            test -n "$(target/debug/blobdive completions "${shell}")"
          done
      - name: Documentation links
        shell: bash
        run: |
          for file in README.md CONCEPT.md ROADMAP.md CHANGELOG.md RELEASING.md \
              SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md GOVERNANCE.md \
              SUPPORT.md ADOPTERS.md docs/*.md; do
            test -s "${file}"
          done
          while IFS= read -r link; do
            target="${link%%#*}"
            test -z "${target}" || test -e "${target}"
          done < <(
            grep -RhoE '\]\([A-Za-z0-9_./-]+\.md(#[^)]+)?\)' \
              --include='*.md' . \
              | sed -E 's/^\]\(([^)#]+)(#[^)]+)?\)$/\1/' \
              | sort -u
          )

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # master, Node 24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install declared MSRV
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check with Rust 1.85
        run: cargo +1.85.0 check --all-targets --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test library and CLI
        run: cargo test --all-targets --locked
      - name: Build release binary
        run: cargo build --release --locked

  adversarial-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Repeat bounded archive fixtures
        shell: bash
        run: |
          for iteration in $(seq 1 10); do
            cargo test --test cli --locked --quiet
            printf 'adversarial iteration %s/10 passed\n' "${iteration}"
          done
