name: Adoption report
description: Share a sanitized BlobDive evaluation or repeat-use report
title: "[Adoption]: "
labels:
  - adoption
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping BlobDive measure real-world usefulness before v1.0.
        This issue is public. Do not include confidential artifacts,
        credentials, private paths, unsafe samples, or unreviewed output.
  - type: input
    id: version
    attributes:
      label: BlobDive version
      description: Prefer the exact output of `blobdive --version`.
      placeholder: blobdive 0.3.0
    validations:
      required: true
  - type: dropdown
    id: relationship
    attributes:
      label: Relationship to the project
      description: This separates independent adoption from maintainer self-evaluation.
      options:
        - Independent user or team
        - Non-maintainer contributor
        - Maintainer or project-affiliated evaluation
    validations:
      required: true
  - type: input
    id: first_use_date
    attributes:
      label: First use date
      description: Use YYYY-MM-DD, or note that the date is approximate.
      placeholder: "2026-07-29"
    validations:
      required: true
  - type: input
    id: latest_use_date
    attributes:
      label: Latest use date
      description: Use the first-use date for a one-off evaluation. Repeat-use credit requires observations at least 30 days apart.
      placeholder: "2026-07-29"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, architecture, and artifact environment.
      placeholder: Ubuntu 24.04 x86_64; CI artifact scanner
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Sanitized workflow
      description: What artifact types, approximate size/depth, commands, and budgets were used?
    validations:
      required: true
  - type: dropdown
    id: repeat_use
    attributes:
      label: Usage duration
      options:
        - Evaluation only
        - Repeated use for less than 30 days
        - Repeated use for at least 30 days
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision improved
      description: What review, routing, quarantine, or extraction decision did it improve?
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: Limitations or failures
      description: Include misdetections, ambiguity, missing format evidence, or missing capability. Write "None observed" if applicable.
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Public evidence
      description: Optional link to a public integration, workflow, or sanitized result.
  - type: dropdown
    id: listing_permission
    attributes:
      label: Listing permission
      description: May maintainers summarize this report in ADOPTERS.md or release notes?
      options:
        - Yes, with the public name given here
        - Yes, only as anonymized or aggregate evidence
        - No, feedback only
    validations:
      required: true
  - type: dropdown
    id: follow_up_permission
    attributes:
      label: Follow-up permission
      description: May maintainers ask for a repeat-use update in this public issue?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: checkboxes
    id: public_safety
    attributes:
      label: Public-data confirmation
      options:
        - label: I reviewed this report and removed secrets, confidential data, private paths, and unsafe artifacts.
          required: true
