[package]
name = "blobdive"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Bounded, read-only inspection of nested software artifacts"
license = "MIT"
repository = "https://github.com/yhay81/blobdive"
homepage = "https://github.com/yhay81/blobdive"
readme = "README.md"
keywords = ["archive", "inspection", "supply-chain", "cli"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["/.github/**", "/.clusterfuzzlite/**", "/.dockerignore", "/fuzz/**"]

[dependencies]
base64 = "0.23.0"
clap = { version = "4.5.48", features = ["derive", "env"] }
clap_complete = "4.5.58"
flate2 = { version = "1.1.2", default-features = false, features = ["rust_backend"] }
humantime = "2.2.0"
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tar = { version = "0.4.44", default-features = false }
thiserror = "2.0.17"
zip = { version = "2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
